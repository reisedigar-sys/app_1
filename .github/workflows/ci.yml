name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Supabase local (aplica migrações e seed do zero)
        run: pnpm db:start

      - name: Tipos do banco atualizados
        run: pnpm db:types:check

      - name: Testes
        run: |
          cp .env.example .env.local
          pnpm exec supabase status -o env | sed -n 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' >> .env.local
          pnpm test

      - name: Build
        run: pnpm build

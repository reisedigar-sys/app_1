name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Supabase local (aplica migrações e seed do zero)
        run: pnpm db:start

      - name: Tipos do banco atualizados
        run: pnpm db:types:check

      - name: Testes
        run: |
          cp .env.example .env.local
          pnpm exec supabase status -o env | sed -n 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' >> .env.local
          pnpm test

      - name: Build
        run: pnpm build

      - name: Navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes ponta a ponta
        run: pnpm test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
